name: Report a listing problem
description: A listing is closed, isn't eligible, or has a wrong title, location or link.
title: "Listing problem: "
labels: [needs-triage, bug]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when something in the tracker is wrong. To add a posting the
        tracker is missing, use **Add internship** instead.
  - type: input
    id: listing
    attributes:
      label: Listing
      description: The company and role as shown in the tracker, or the Apply link.
      placeholder: "Intuitive, Data Engineering Intern"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - Closed or no longer accepting applications
        - Not eligible (not in the US, not an internship or co-op, not STEM, wrong year, or PhD-only)
        - Wrong title, location or details
        - Apply link is broken or goes to the wrong posting
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw, and a link that shows it if you have one.
    validations:
      required: false
