name: Daily refresh

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: read every company and report, write nothing, push nothing"
        type: boolean
        default: false

# A real refresh pushes with the REFRESH_DEPLOY_KEY deploy key, not this token.
# The token only opens a pull request when REFRESH_AUTOMERGE is false.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only main may publish. A real refresh dispatched on any other ref would
      # build data with unmerged code, so it stops here before doing anything.
      # The schedule always runs on main, and inputs.dry_run is empty there.
      - name: Refuse to publish from a ref other than main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          message="A real refresh only runs on main, not ${REF}. Nothing was refreshed or pushed. Dispatch with dry_run to test this ref."
          echo "::error::${message}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
          exit 1

      # A real run publishes with the deploy key, the only actor main's
      # "Protect main" ruleset lets skip review and required checks. Without it
      # the push would be refused, so fail before reading anything.
      - name: Require the deploy key
        if: ${{ !inputs.dry_run }}
        env:
          HAS_KEY: ${{ secrets.REFRESH_DEPLOY_KEY != '' }}
        run: |
          if [ "${HAS_KEY}" != "true" ]; then
            message="The REFRESH_DEPLOY_KEY secret is not set, so a real refresh can't push to main. See \"How it works\" in the README."
            echo "::error::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

      # A real run checks out main's tip rather than the triggering commit, so
      # "Re-run jobs" refreshes from current main instead of a stale github.sha.
      # A dry run keeps the dispatched ref, which is the branch under test, and
      # gets no deploy key since it pushes nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ !inputs.dry_run && 'main' || '' }}
          ssh-key: ${{ !inputs.dry_run && secrets.REFRESH_DEPLOY_KEY || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      # Both refresh steps echo text from job boards to the log, so workflow
      # commands are paused around them and a posting can't inject "::" commands.
      # The output is saved for failed-reads.sh, which emits one escaped warning
      # per failed read once commands are resumed and lists the failed reads in
      # the job summary (a dry run's summary also shows the whole output,
      # HTML-escaped so text from job boards can't alter it). Each step still
      # exits with the command's status, so a run in which every company failed
      # stops the job.
      - name: Refresh listings (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP}/refresh.txt"
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          status=0
          python -m tracker refresh --dry-run 2>&1 | tee "${out}" || status=$?
          echo "::${token}::"
          bash .github/scripts/failed-reads.sh annotations "${out}"
          {
            echo "### Dry run on \`${GITHUB_REF_NAME}\` (exit ${status})"
            echo
            bash .github/scripts/failed-reads.sh log "${out}"
            echo
            bash .github/scripts/failed-reads.sh summary "${out}"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Refresh listings
        if: ${{ !inputs.dry_run }}
        run: |
          set -o pipefail
          out="${RUNNER_TEMP}/refresh.txt"
          token="$(openssl rand -hex 16)"
          echo "::stop-commands::${token}"
          status=0
          python -m tracker refresh 2>&1 | tee "${out}" || status=$?
          echo "::${token}::"
          bash .github/scripts/failed-reads.sh annotations "${out}"
          bash .github/scripts/failed-reads.sh summary "${out}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      # The same checks CI runs. The deploy key skips main's required checks,
      # so this step is what keeps data that fails them off main.
      - name: Check
        if: ${{ !inputs.dry_run }}
        run: |
          ruff check .
          ruff format --check .
          pytest -q
          python -m tracker validate
          python -m tracker render --check

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMERGE: ${{ vars.REFRESH_AUTOMERGE }}
        run: |
          if git diff --quiet -- data README.md CLOSED.md; then
            echo "Nothing changed." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md CLOSED.md
          git commit -m "data: daily refresh ${day}"

          if [ "${AUTOMERGE}" != "false" ]; then
            # origin uses the deploy key, which may push to main directly. The
            # history ruleset still refuses a force-push, so if main moved since
            # checkout this fails and the next run refreshes from the new main.
            if ! git push origin HEAD:main; then
              echo "::error::main changed while the refresh ran; nothing was pushed. Run the refresh again."
              exit 1
            fi
            echo "Pushed $(git rev-parse --short HEAD) to main." | tee -a "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # REFRESH_AUTOMERGE=false: leave the day's data in a pull request for a
          # maintainer to review and merge. A rerun on the same day force-pushes
          # the branch and reuses the pull request if it is still open.
          branch="refresh/${day}"
          git push --force origin "HEAD:refs/heads/${branch}"
          # Reuse only an open pull request from this repository's own branch: a
          # merged or closed one from an earlier run today is ignored, and a
          # fork's branch with the same name is never picked up.
          pr_url="$(gh pr list --head "${branch}" --base main --state open \
            --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // empty')"
          # The body lists this run's failed reads, if any. A reused pull
          # request gets the new body, so it never shows an earlier run's.
          body="${RUNNER_TEMP}/pr-body.md"
          report="$(bash .github/scripts/failed-reads.sh report "${RUNNER_TEMP}/refresh.txt")"
          {
            echo "Automated listing refresh. Checks ran in the workflow before this PR was opened."
            echo
            echo "CI on this pull request waits for a maintainer to approve the run (GitHub holds runs on pull requests opened by a workflow)."
            if [ -n "${report}" ]; then
              echo
              echo "${report}"
            fi
          } > "${body}"
          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create --base main --head "${branch}" \
              --title "data: daily refresh ${day}" --body-file "${body}")"
          else
            gh pr edit "${pr_url}" --body-file "${body}"
          fi
          echo "REFRESH_AUTOMERGE is false; pull request left open for review: ${pr_url}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"
