careers_url = "https://neuralink.com/careers/"
params = { board = "neuralink" }
program = { label = "Open roles", url = "https://neuralink.com/careers/", location = "Fremont, CA" }
note = "Open year-round. Check the posting for start dates."
rolling = true

# NIH's internship programs are not job postings: students apply once through
# NIH's Application Center, so there is nothing to read and NIH is link-only.
# training.nih.gov's Cloudflare blocked a maintainer's cloud server by IP, but
# GitHub's runners read it with the tracker's client on 2026-11-24. The Summer
# Internship Program (SIP) is NIH-wide; BESIP is NIBIB's biomedical engineering
# subprogram of it, kept as its own entry so a BESIP listing doesn't hide the
# SIP link. Its yearly listing is submitted from www.nibib.nih.gov with the
# application deadline as "Closes on".
[[companies]]
name = "NIH"
platform = "link"
careers_url = "https://www.training.nih.gov/"
program = { label = "Summer Internship Program (SIP)", url = "https://www.training.nih.gov/research-training/pb/sip/", location = "Bethesda, MD" }
note = "One application for the whole program, not per position. Labs across NIH review it."

[[companies]]
name = "NIH NIBIB"
platform = "link"
careers_url = "https://www.nibib.nih.gov/labs-at-nibib"
program = { label = "Biomedical Engineering Summer Internship Program (BESIP)", url = "https://www.nibib.nih.gov/labs-at-nibib/besip", location = "Bethesda, MD" }
note = "One application for the whole program, not per position: choose NIBIB-BESIP in NIH's Application Center, then rank its projects."
submit_hosts = ["www.nibib.nih.gov"]

