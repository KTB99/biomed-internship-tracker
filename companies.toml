# Companies the tracker reads, and the season it targets.
#
# Each company names one platform from tracker/sources and that platform's
# parameters. `careers_url` is the company's careers site, linked from the
# README. `program` is the company's own internship page, listed in the README
# whenever the company has no open postings we can read.
#
# platform = "link" means no automated reader: only the program page is shown
# (currently J&J MedTech, whose site refuses automated requests, and NIH's
# programs, which publish no postings to read).
# `search_terms` (optional, in params) replaces the default terms
# ("intern", "internship", "co-op") on search-based platforms.
#
# `note` (optional) is a short line shown in small text under the company's role
# and program titles in the README, for something every listing there shares.
#
# `rolling = true` (optional) is for a company whose postings name no term and
# stay open year-round: the README shows "rolling" in the Age column instead of
# an age counted from a posted date that says nothing about the season.
#
# `submit_hosts` (optional) lists the hosts an Apply URL may use when someone
# submits a posting for the company by hand. The URL must be https and its host
# must equal one entry exactly: no subdomains or wildcards. A company without
# `submit_hosts` accepts no submissions.

season = "summer-2027"

