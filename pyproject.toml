[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomed-internship-tracker"
version = "0.1.0"
description = "Daily-refreshed list of US STEM summer internships at biomedical device companies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyle Burger" }]
dependencies = ["requests>=2.31", "jsonschema>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyyaml>=6"]

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
